<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#164e63" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#082f49" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="cyberRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#050505"/>
  <rect width="512" height="512" rx="100" fill="url(#bgGlow)"/>

  <!-- Outer HUD Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#0e7490" stroke-width="3" stroke-dasharray="12 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="url(#cyberCyan)" stroke-width="5" filter="url(#glow)"/>

  <!-- Inner Arc Reactor Core -->
  <circle cx="256" cy="256" r="130" fill="#042f2e" stroke="#22d3ee" stroke-width="4" opacity="0.8"/>
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="20 10"/>

  <!-- Tactical Crosshairs -->
  <line x1="256" y1="70" x2="256" y2="110" stroke="#22d3ee" stroke-width="4"/>
  <line x1="256" y1="402" x2="256" y2="442" stroke="#22d3ee" stroke-width="4"/>
  <line x1="70" y1="256" x2="110" y2="256" stroke="#22d3ee" stroke-width="4"/>
  <line x1="402" y1="256" x2="442" y2="256" stroke="#22d3ee" stroke-width="4"/>

  <!-- Center DEVIL Emblem (Stylized Cyber D) -->
  <path d="M 210 180 L 255 180 C 295 180 325 210 325 256 C 325 302 295 332 255 332 L 210 332 Z" 
        fill="none" stroke="url(#cyberCyan)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="28" fill="url(#cyberRed)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="12" fill="#ffffff"/>
</svg>
